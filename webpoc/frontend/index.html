<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STAMP-web (PoC)</title>
    <style>
      :root { --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ea; --ink:#1f2933; --muted:#6b7280;
              --accent:#2b6cb0; --g1:#80b1d3; --g2:#fdb462; }
      * { box-sizing: border-box; }
      body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
             color:var(--ink); background:var(--bg); }
      h1 { font-size:18px; margin:0; font-weight:650; }
      h1 span { color:var(--muted); font-weight:400; }
      header { background:var(--panel); border-bottom:1px solid var(--line); padding:12px 20px;
               display:flex; align-items:baseline; gap:12px; }
      .wrap { display:grid; grid-template-columns:300px 1fr; gap:16px; padding:16px; align-items:start; }
      .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
      label { display:block; font-size:12px; color:var(--muted); margin:10px 0 3px; font-weight:600;
              text-transform:uppercase; letter-spacing:.02em; }
      select, button { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px;
              background:#fff; font-size:14px; color:var(--ink); }
      button.run { margin-top:16px; background:var(--accent); color:#fff; border:none; font-weight:600;
              cursor:pointer; padding:10px; }
      button.run:disabled { opacity:.5; cursor:not-allowed; }
      .meta { color:var(--muted); font-size:12px; margin:6px 0 0; }
      .stat { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
      .stat div { background:#eef2f7; border-radius:7px; padding:6px 12px; font-size:13px; }
      .stat b { color:var(--accent); }
      table { border-collapse:collapse; width:100%; font-size:13px; margin-top:8px; }
      th,td { text-align:right; padding:5px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
      th:first-child, td:first-child { text-align:left; }
      th { color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--panel); }
      .tablewrap { max-height:320px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
      .sig { color:#137752; font-weight:600; }
      .err { color:#c0392b; padding:10px; }
      .hint { color:var(--muted); font-size:12px; margin-top:4px; }
      .tabs { display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--line); }
      .tab { padding:8px 14px; cursor:pointer; border:1px solid transparent; border-bottom:none;
             border-radius:8px 8px 0 0; color:var(--muted); font-weight:600; font-size:13px; margin-bottom:-1px; }
      .tab.active { color:var(--accent); background:var(--panel); border-color:var(--line); border-bottom:1px solid var(--panel); }
      .filebox { border:1px dashed #c3ccd6; border-radius:8px; padding:10px; margin-top:6px; background:#fafbfc; }
      .filebox input[type=file] { width:100%; font-size:12px; margin:4px 0; }
      .row2 { display:flex; gap:8px; }
      .row2 > * { flex:1; min-width:0; }
      .chk { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:13px; color:var(--ink); }
      .chk input { width:auto; }
      .num { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px; font-size:14px; }
      .legend { display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 2px; font-size:12px; color:var(--muted); }
      .legend span { display:inline-flex; align-items:center; gap:5px; }
      .sw { width:11px; height:11px; border-radius:3px; display:inline-block; }
      .busy { color:var(--accent); font-size:13px; margin-top:8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
