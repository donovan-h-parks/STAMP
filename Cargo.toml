[workspace]
resolver = "2"
members = ["crates/stamp-core", "crates/stamp-plot", "crates/stamp-cli", "crates/stamp-gui"]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["Donovan Parks", "Rob Beiko"]
repository = "https://github.com/donovan-h-parks/STAMP"

[workspace.dependencies]
stamp-core = { path = "crates/stamp-core" }
stamp-plot = { path = "crates/stamp-plot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Reads BIOM 2.x tables (HDF5) without the C library, so that it also works in
# the browser.
hdf5-pure = { version = "0.48", default-features = false, features = ["std", "deflate"] }
clap = { version = "4", features = ["derive"] }
# OpenGL / WebGL2 rendering: the most widely supported backend on older
# desktops, remote sessions and every current browser.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    # Remembers the window layout and the user's settings between runs.
    "persistence",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui_extras = "0.37"
rfd = "0.17"
png = "0.17"
statrs = { version = "0.19", default-features = false, features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = { version = "0.10", default-features = false }
rand_distr = "0.6"
libm = "0.2"
kodama = "0.3"
# Eigen decompositions for the ordinations (pure Rust).
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
ttf-parser = "0.25"
# Triangulates the filled outlines of the map plot for the on-screen painter
# (pure Rust).
earcut = "0.4"
# Only text is needed to render STAMP's own SVG: no system fonts (the fonts
# are bundled), raster images or filters, which would add to the browser
# download.
# The version svg2pdf builds on, so that one copy of the SVG library is
# compiled rather than two.
resvg = { version = "0.45", default-features = false, features = ["text"] }
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }

[profile.release]
lto = "thin"
# Smaller downloads. Only debug information is removed: the browser build's
# optimiser needs the other sections, and panics keep their location.
strip = "debuginfo"

# The browser build: whole-program optimisation in one unit, which makes the
# download smaller and the code faster, at the cost of a longer build. Used
# by trunk (crates/stamp-gui/index.html).
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1
