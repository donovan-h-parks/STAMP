[workspace]
resolver = "2"
members = ["crates/stamp-core", "crates/stamp-plot", "crates/stamp-cli", "crates/stamp-gui"]

[workspace.package]
version = "3.0.0-alpha.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["Donovan Parks", "Rob Beiko"]
repository = "https://github.com/dparks1134/STAMP"

[workspace.dependencies]
stamp-core = { path = "crates/stamp-core" }
stamp-plot = { path = "crates/stamp-plot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
clap = { version = "4", features = ["derive"] }
eframe = "0.37"
statrs = { version = "0.19", default-features = false, features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = { version = "0.10", default-features = false }
rand_distr = "0.6"
libm = "0.2"
ttf-parser = "0.25"
resvg = "0.50"
svg2pdf = "0.13"

[profile.release]
lto = "thin"
