name: Publish documentation

# Publishes the documentation (docs/site, built by Sphinx) to GitHub Pages,
# under docs/, with the site's root sending visitors there. It only runs when
# started by hand from the Actions tab, and needs Pages to be enabled for the
# repository with "GitHub Actions" as the source (Settings > Pages).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/site/requirements.txt
      - run: sphinx-build -b html -W docs/site site/docs
      # The documentation keeps its address under docs/; the root, where the
      # browser version used to be, sends visitors to it.
      - run: printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=docs/"><a href="docs/">STAMP documentation</a>\n' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
