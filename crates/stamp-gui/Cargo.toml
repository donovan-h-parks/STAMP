[package]
name = "stamp-gui"
description = "STAMP graphical application for desktop and the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "stamp_gui"
path = "src/lib.rs"

[[bin]]
name = "stamp"
path = "src/main.rs"

[dependencies]
stamp-core = { workspace = true }
stamp-plot = { workspace = true }
eframe = { workspace = true }
egui_extras = { workspace = true }
png = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
