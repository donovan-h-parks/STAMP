[package]
name = "stamp-gui"
description = "STAMP graphical application for desktop and the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "stamp_gui"
path = "src/lib.rs"

[[bin]]
name = "stamp"
path = "src/main.rs"

# The program Claude Desktop starts to reach a running STAMP.
[[bin]]
name = "stamp-mcp"
path = "src/bridge_main.rs"

[dependencies]
stamp-core = { workspace = true }
stamp-plot = { workspace = true }
eframe = { workspace = true }
serde = { workspace = true }
flate2 = { workspace = true }
egui_extras = { workspace = true }
png = { workspace = true }
rfd = { workspace = true }
serde_json = { workspace = true }

# The Claude Code panel: a terminal emulator and pseudo-terminal (ConPTY on
# Windows). Desktop only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
alacritty_terminal = "0.26"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "Url",
    "Window",
] }

# Compresses the larger built-in example dataset when the program is built,
# and embeds the application icon and version details in the Windows
# executable (also when it is cross-compiled from Linux or macOS, with
# llvm-rc).
[build-dependencies]
flate2 = { workspace = true }
winresource = "0.1"
