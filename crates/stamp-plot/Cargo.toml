[package]
name = "stamp-plot"
description = "STAMP plots as backend-neutral figures, with SVG/PNG/PDF export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["png"]
# PNG export through resvg. SVG and PDF export are always available (PDF is
# written directly, see src/pdf.rs).
png = ["dep:resvg"]

[dependencies]
stamp-core = { workspace = true }
ttf-parser = { workspace = true }
earcut = { workspace = true }
serde = { workspace = true }
# Compresses the streams of PDF files.
flate2 = { workspace = true }
resvg = { workspace = true, optional = true }
