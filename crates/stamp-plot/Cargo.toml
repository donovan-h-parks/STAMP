[package]
name = "stamp-plot"
description = "STAMP plots as backend-neutral figures, with SVG/PNG/PDF export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["png", "pdf"]
# Raster export through resvg.
png = ["dep:resvg"]
# PDF export through svg2pdf.
pdf = ["dep:svg2pdf"]

[dependencies]
stamp-core = { workspace = true }
ttf-parser = { workspace = true }
resvg = { workspace = true, optional = true }
svg2pdf = { workspace = true, optional = true }
