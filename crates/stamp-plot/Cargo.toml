[package]
name = "stamp-plot"
description = "STAMP plots as backend-neutral figures, with SVG/PNG/PDF export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
stamp-core = { workspace = true }
ttf-parser = { workspace = true }
earcut = { workspace = true }
serde = { workspace = true }
# Custom plots are described in JSON (a subset of Vega-Lite).
serde_json = { workspace = true }
# Compresses the streams of PDF files.
flate2 = { workspace = true }
# PNG export. SVG and PDF are written directly (src/svg.rs, src/pdf.rs).
resvg = { workspace = true }
